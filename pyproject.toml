[project]
name = "regugraph-uae"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jayanth Kumar", email = "nanijnth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.5",
    "langchain>=0.2.14",
    "langchain-community>=0.2.12",
    "langchain-ollama>=0.1.3",
    "langgraph>=0.2.16",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "pdfplumber>=0.11.4",
    "plotly>=5.24.0",
    "pydantic>=2.8.2",
    "pypdf>=4.3.1",
    "pytest>=8.3.2",
    "rank-bm25>=0.2.2",
    "streamlit>=1.38.0",
]

[project.scripts]
regugraph-uae = "regugraph_uae:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
